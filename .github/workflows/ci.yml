name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Repo guard (spec sections, two-repo warning, no case workspaces)
        run: python scripts/check_repo.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (recorded fixtures only, no live network)
        run: pytest -q
      - name: Validate fixture workspaces
        run: |
          for ws in tests/fixtures/workspaces/*/; do
            lighthouse-gc validate -w "$ws"
          done

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Unit tests (navigation, no browser)
        run: npm --prefix web test
      - name: Type-check and build
        run: npm --prefix web run build

  wheel:
    name: Wheel (clean install + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard into the package
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: Smoke test (serves the dashboard, no checkout or Node)
        run: python scripts/smoke_wheel.py "$RUNNER_TEMP/venv/bin/lighthouse-gc"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  install-sh:
    name: install.sh on ${{ matrix.os }}
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run the installer against the wheel just built
        run: |
          LIGHTHOUSE_GC_SPEC="$(ls "$PWD"/dist/*.whl)" LIGHTHOUSE_GC_NO_RUN=1 sh install.sh
      - name: Installed command works and serves the dashboard
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          lighthouse-gc --help
          python3 scripts/smoke_wheel.py "$(command -v lighthouse-gc)"

  install-ps1:
    name: install.ps1 on Windows
    needs: wheel
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Run the installer the way the one line does (irm | iex)
        shell: powershell
        run: |
          $env:LIGHTHOUSE_GC_SPEC = (Get-Item dist\*.whl).FullName
          $env:LIGHTHOUSE_GC_NO_RUN = '1'
          Get-Content install.ps1 -Raw | Invoke-Expression
      - name: Installed command works and serves the dashboard
        shell: powershell
        run: |
          $env:PYTHONUTF8 = '1'  # output is redirected here, not a console
          $exe = Join-Path $HOME '.local\bin\lighthouse-gc.exe'
          & $exe --help
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python scripts/smoke_wheel.py $exe
          if ($LASTEXITCODE -ne 0) { exit 1 }
