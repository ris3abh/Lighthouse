name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Repo guard (spec sections, two-repo warning, no case workspaces)
        run: python scripts/check_repo.py
      - name: Ruff
        run: |
          ruff check .
          ruff format --check .
      - name: Mypy
        run: mypy
      - name: Pytest (recorded fixtures only, no live network)
        run: pytest -q
      - name: Validate fixture workspaces
        run: |
          for ws in tests/fixtures/workspaces/*/; do
            lighthouse-gc validate -w "$ws"
          done

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm --prefix web ci
      - name: Unit tests (navigation, no browser)
        run: npm --prefix web test
      - name: Type-check and build
        run: npm --prefix web run build

  wheel:
    name: Wheel (clean install + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the dashboard into the package
        run: |
          npm --prefix web ci
          npm --prefix web run build
      - name: Build sdist and wheel
        run: |
          python -m pip install build
          python -m build
      - name: Install the wheel in a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install dist/*.whl
      - name: Smoke test (serves the dashboard, no checkout or Node)
        run: python scripts/smoke_wheel.py "$RUNNER_TEMP/venv/bin/lighthouse-gc"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
