name: Vault sources (weekly)

# Re-checks the vault test fixtures and every quoted passage of the standard against their sources. It uses the
# network, so it never runs on push or in pull requests; only weekly and by hand. Kazarian is read live. uscis.gov
# blocks GitHub's runners, so the Policy Manual chapters are compared through the community library's newest
# hash-verified snapshot ("checked via community snapshot, captured <date>"); Area O1's vault-watch on the owner's
# machine reads them live and keeps those snapshots fresh. Only a real wording mismatch turns this red (and opens an
# issue, or comments on the open one); a source with neither a live copy nor a snapshot newer than 30 days is a
# "stale" warning.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays, 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: vault-fixtures
  cancel-in-progress: false

jobs:
  check:
    name: Live sources still say what we quote
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: python -m pip install -e .
      - name: Check against the sources (live, else the community snapshot)
        id: check
        run: |
          set +e
          python scripts/check_vault_fixtures.py --report report.md
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
          if grep -q "stale" report.md; then
            grep "stale" report.md | sed 's/^- //' | while read -r line; do echo "::warning title=Stale source::$line"; done
          fi
          exit 0
      - name: Open or update the issue (wording changed)
        if: steps.check.outputs.code == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create vault-wording --color B60205 --force \
            --description "A vault source's wording no longer matches what Area O1 quotes" >/dev/null
          {
            echo "The weekly check found that a source no longer says what the vault fixtures or the quoted standard say."
            echo "Review the passages below; update the quote (profiles/*.yaml) and the fixture (tests/fixtures/vault, SOURCES.json) from the new wording, citing the new section if it moved."
            echo
            cat report.md
            echo
            echo "Run: $RUN_URL"
          } > body.md
          open=$(gh issue list --label vault-wording --state open --json number -q '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file body.md
          else
            gh issue create --title "Vault source wording changed ($(date -u +%Y-%m-%d))" --label vault-wording --body-file body.md
          fi
          exit 1  # a real mismatch: the run shows red
      - name: Fail when the check itself couldn't run
        if: steps.check.outputs.code != '0' && steps.check.outputs.code != '1'
        run: |
          echo "::error::The check couldn't run (exit ${{ steps.check.outputs.code }}); see the log. No issue was opened."
          exit 1
