# The docs site (served at /docs/ next to the landing page; see .github/workflows/pages.yml).
# Build: uv pip install -e '.[docs]' && mkdocs build --strict   (or mkdocs serve to preview)
site_name: Area O1 docs
site_description: Your O-1A / EB-1A evidence file, built on your own computer.
site_url: https://ris3abh.github.io/areao1/docs/
repo_url: https://github.com/ris3abh/areao1
repo_name: ris3abh/areao1
edit_uri: edit/main/docs/manual/
copyright: Area O1 is not legal advice and is not affiliated with USCIS. Apache-2.0.
docs_dir: docs/manual
site_dir: build/docs

theme:
  name: material
  logo: assets/logo.svg
  favicon: assets/logo.svg
  font: false               # Archivo and JetBrains Mono ship with the site (stylesheets/brutalism.css)
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: {icon: material/weather-night, name: Dark theme}
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: {icon: material/weather-sunny, name: Light theme}
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/brutalism.css

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc: {permalink: true}
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed: {alternate_style: true}
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ris3abh/areao1

