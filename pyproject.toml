[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "areao1"
version = "0.2.0"
description = "Local-first command center for building an O-1A / EB-1A extraordinary-ability evidence file."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Rishabh Sharma" }]
keywords = ["o-1a", "eb-1a", "immigration", "evidence", "dashboard", "local-first"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Web Environment",
  "Framework :: FastAPI",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "typer>=0.12",
  "pydantic>=2.7",
  "httpx>=0.27",
  "pyyaml>=6.0",
  "keyring>=25.0",
  "mcp>=2.3,<3",
  "apscheduler>=3.10,<4",
  "tzlocal>=5.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "respx>=0.21",
  "jsonschema>=4.22",
  "ruff>=0.6",
  "mypy>=1.10",
  "types-PyYAML",
  "icalendar>=6.0",
]

[project.scripts]
areao1 = "areao1.cli:app"
lighthouse-gc = "areao1.cli:deprecated"  # Lighthouse-era name; says the new one, then runs (ADR 0010)

[project.urls]
Homepage = "https://github.com/ris3abh/areao1"

[tool.hatch.build.targets.wheel]
packages = ["areao1"]
# The built web UI is gitignored but must ship inside the wheel.
artifacts = ["areao1/server/static/**"]

[tool.hatch.build.targets.wheel.force-include]
"profiles" = "areao1/_data/profiles"
"vault" = "areao1/_data/vault"

[tool.hatch.build.targets.sdist]
include = ["areao1", "profiles", "examples", "vault", "tests", "web/src", "web/*.json", "web/*.ts", "web/index.html", "*.md", "LICENSE", "NOTICE"]
# The built UI too, so a wheel built from the sdist (the default for `python -m build`) still has it.
artifacts = ["areao1/server/static/**"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]  # line length is owned by `ruff format`

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.11"
packages = ["areao1"]
ignore_missing_imports = true
check_untyped_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
