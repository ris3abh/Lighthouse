# EB-1A — immigrant petition for aliens of extraordinary ability.
# Community-maintained summary of 8 CFR 204.5(h)(3). NOT legal advice. Not affiliated with USCIS.
#
# Same evidence store and criterion ids as o1a; a stricter rubric (more exhibits and signals per
# criterion) plus a final-merits narrative layer. Switching profile re-scores, never re-collects.
id: eb1a
name: EB-1A Extraordinary Ability
regulation: 8 CFR 204.5(h)(3)
description: >
  Evidence of a one-time major internationally recognized award, or at least three of the ten criteria
  below, followed by a final-merits determination of sustained national or international acclaim.
threshold: 3
target: 5
criteria:
  - id: awards
    label: Lesser nationally or internationally recognized prizes or awards
    short_label: Awards
    regulation: 8 CFR 204.5(h)(3)(i)
    evidence_types: [award_certificate, award_notice, fellowship, hackathon_win]
    strength_signals:
      - { id: national_or_international, label: "national or international scope" }
      - { id: selective, label: "selective (documented acceptance rate or field size)" }
      - { id: excellence_based, label: "awarded for excellence, not participation" }
    bank: { min_exhibits: 2, min_signals: 2 }

  - id: membership
    label: Membership in associations requiring outstanding achievement
    short_label: Membership
    regulation: 8 CFR 204.5(h)(3)(ii)
    evidence_types: [membership_certificate, membership_letter, membership_bylaws]
    strength_signals:
      - { id: judged_by_experts, label: "admission judged by recognized experts" }
      - { id: outstanding_achievement_required, label: "outstanding achievement required" }
    bank: { min_exhibits: 1, min_signals: 2 }

  - id: press
    label: Published material about you in major media or trade publications
    short_label: Press
    regulation: 8 CFR 204.5(h)(3)(iii)
    evidence_types: [press_article, interview, podcast_feature, media_mention]
    strength_signals:
      - { id: about_the_person, label: "primarily about you or your work" }
      - { id: major_media, label: "major media or professional publication" }
      - { id: multiple_outlets, label: "multiple independent outlets" }
    bank: { min_exhibits: 3, min_signals: 2 }

  - id: judging
    label: Judging the work of others
    short_label: Judging
    regulation: 8 CFR 204.5(h)(3)(iv)
    evidence_types: [judge_invite, reviewer_record, panel_letter, program_committee]
    strength_signals:
      - { id: selective_event, label: "selective event" }
      - { id: multiple_instances, label: "multiple instances" }
      - { id: documented_scoring, label: "documented scoring" }
    bank: { min_exhibits: 3, min_signals: 2 }

  - id: original_contributions
    label: Original contributions of major significance
    short_label: Contributions
    regulation: 8 CFR 204.5(h)(3)(v)
    evidence_types: [open_source_project, ml_model, dataset, patent, adoption_evidence, expert_letter]
    strength_signals:
      - { id: widely_adopted, label: "widely adopted (stars, downloads, dependents)" }
      - { id: used_by_others, label: "built on or used by others" }
      - { id: independent_corroboration, label: "independent corroboration (letters, press, citations)" }
      - { id: sustained_activity, label: "sustained over time (releases, maintenance)" }
    bank: { min_exhibits: 3, min_signals: 3 }

  - id: scholarly_articles
    label: Authorship of scholarly articles
    short_label: Articles
    regulation: 8 CFR 204.5(h)(3)(vi)
    evidence_types: [paper, preprint, journal_article, conference_paper]
    strength_signals:
      - { id: peer_reviewed, label: "peer-reviewed" }
      - { id: cited, label: "citations > 0" }
      - { id: major_venue, label: "major venue" }
    bank: { min_exhibits: 2, min_signals: 2 }

  - id: display
    label: Display of work at artistic exhibitions or showcases
    short_label: Display
    regulation: 8 CFR 204.5(h)(3)(vii)
    evidence_types: [exhibition_record, showcase]
    strength_signals:
      - { id: major_venue, label: "major venue" }
      - { id: curated_selection, label: "curated or juried selection" }
    bank: { min_exhibits: 2, min_signals: 1 }

  - id: critical_role
    label: Leading or critical role for distinguished organizations
    short_label: Critical role
    regulation: 8 CFR 204.5(h)(3)(viii)
    evidence_types: [role_letter, org_chart, offer_letter, org_reputation]
    strength_signals:
      - { id: distinguished_org, label: "organization has a distinguished reputation" }
      - { id: critical_capacity, label: "role documented as leading or critical" }
    bank: { min_exhibits: 2, min_signals: 2 }

  - id: high_salary
    label: High salary or remuneration relative to others in the field
    short_label: Salary
    regulation: 8 CFR 204.5(h)(3)(ix)
    evidence_types: [pay_stub, offer_letter, w2, salary_survey]
    strength_signals:
      - { id: comparative_data, label: "comparative wage data (e.g. survey, BLS)" }
      - { id: above_90th_percentile, label: "above the 90th percentile" }
    bank: { min_exhibits: 2, min_signals: 2 }

  - id: commercial_success
    label: Commercial success in the performing arts
    short_label: Commercial success
    regulation: 8 CFR 204.5(h)(3)(x)
    evidence_types: [box_office, sales_record]
    strength_signals:
      - { id: documented_receipts, label: "documented receipts or sales" }
    bank: { min_exhibits: 1, min_signals: 1 }

narrative:
  - id: final_merits
    label: Final merits — sustained national or international acclaim
    description: >
      After three criteria are met, the totality of the evidence must show you are one of the small
      percentage at the very top of the field, with sustained acclaim. Written by the agent (Phase 2)
      and always labeled as an opinion.
    prompts:
      - Is the acclaim sustained over several years rather than a single moment?
      - Does independent evidence (not only your own employer) corroborate the impact?
      - How does the record compare to others at the top of the field?

# The final-merits view (ADR 0019): rule-computed themes over the counted evidence, and the standard as the vault
# states it. Statuses describe the evidence against these rules; they are not a verdict.
final_merits:
  label: Final merits
  framing: >
    Meeting three criteria is step one. In step two the officer weighs all of the evidence together. These themes
    show what your counted evidence covers, each against a rule you can read below; they aren't a score and they
    don't predict the officer's weighing, which is holistic.
  themes:
    - id: independent_recognition
      label: Independent recognition
      rule: independent_letters
      description: People and organizations with no stake in your work vouch for it.
      strong: 2
      strong_share: 0.5
      building: 1
      criteria: [awards, press]
    - id: outside_employer
      label: Recognition outside your employer
      rule: outside_employer
      description: Counted exhibits issued or published by organizations other than your employer.
      strong: 3
      building: 1
    - id: multiple_years
      label: Evidence across multiple years
      rule: years
      description: Acclaim that is sustained, not a single moment.
      strong: 3
      building: 2
    - id: peer_context
      label: Peer-relative context
      rule: peer_context
      description: How the record compares with others in the field (field benchmarks, documented selectivity).
      strong: 2
      building: 1
      signals: [selective, selective_event, judged_by_experts, outstanding_achievement_required, major_venue, comparative_data, above_90th_percentile, distinguished_org]
    - id: external_adoption
      label: External adoption
      rule: adoption
      description: Your work is used, built on or implemented by others.
      strong: 2
      building: 1
      evidence_types: [adoption_evidence]
      signals: [widely_adopted, used_by_others]
  # Each passage is a whole sentence copied word for word from the source (checked against the live pages on
  # 2026-10-09); the page shows it with its section and checks it against your vault's copy.
  standard:
    - quote: Officers should use a two-step analysis to evaluate the evidence submitted with the petition to demonstrate eligibility for classification as a person with extraordinary ability.
      source_id: uscis-pm-6-f-2
      section: USCIS Policy Manual, Vol. 6, Part F, Ch. 2, Sec. B (Evidence of Extraordinary Ability)
    - quote: Evaluate all the evidence together when considering the petition in its entirety for the final merits determination, in the context of the high level of expertise required for this immigrant classification.
      source_id: uscis-pm-6-f-2
      section: USCIS Policy Manual, Vol. 6, Part F, Ch. 2, Sec. B, table "Overview of Two-Step Evidentiary Review", Step 2
    - quote: The question of whether the person is one of that small percentage who have risen to the very top of the field of endeavor and enjoys sustained national or international acclaim should be addressed in the second step of the analysis (final merits determination).
      source_id: uscis-pm-6-f-2
      section: USCIS Policy Manual, Vol. 6, Part F, Ch. 2, Sec. B.1 (Initial Evidence of Extraordinary Ability)
    - quote: While a person may be stronger in one particular evidentiary area than in others, the totality of the evidence must establish that the person is extraordinary.
      source_id: uscis-pm-6-f-2
      section: USCIS Policy Manual, Vol. 6, Part F, Ch. 2, Sec. B.2 (Final Merits Determination)
    - quote: While other authors’ citations (or a lack thereof) might be relevant to the final merits determination of whether a petitioner is at the very top of his or her field of endeavor, they are not relevant to the antecedent procedural question of whether the petitioner has provided at least three types of evidence.
      source_id: kazarian-v-uscis
      section: Kazarian v. USCIS, 596 F.3d 1115 (9th Cir. 2010), slip op. at 3440
