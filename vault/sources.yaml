# Knowledge vault manifest (SPEC 5a). Community-maintained: URLs, tiers and freshness windows only.
# Fetched content and embeddings live in each workspace's cache (.areao1/cache/vault), never here.
#
# Tiers: 1 = primary law and agency pages, 2 = adjudication, 3 = secondary (context only, never the sole
# source for a rule claim).
#
# A workspace can add or override sources in its own vault/sources.yaml (same format, matched by id).
#
# url placeholders: {ecfr_date} (latest eCFR issue date for ecfr_title), {year}, {month} (e.g. october),
# {fy} (US federal fiscal year of the current month). start / end are regexes (multiline) that cut the
# extracted text to the part that matters, e.g. one paragraph of a long regulation section.
#
# manual: true marks sites that usually block automated reading (uscis.gov, travel.state.gov). They're still
# tried, but expect to import a saved copy (Knowledge page or `areao1 vault import`); vault-watch sends a
# reminder with the page link when an imported copy passes its freshness window.
# secondary_to: the primary source for the same facts. When the two disagree, the primary governs (e.g. the fee
# regulation, 8 CFR part 106, over the USCIS fee page).
version: 1

# Freshness registry: how long a fetched fact stays usable before it must be re-fetched. Volatile facts
# (fees, form editions, processing times, the Visa Bulletin) have short windows. "monthly" expires at the
# start of the next calendar month.
ttl_days:
  fees: 7
  form: 7
  processing_times: 7
  visa_bulletin: monthly
  federal_register: 7
  regulation: 30
  statute: 30
  policy: 30
  guidance: 30
  decisions: 30
  case_law: 365
  secondary: 30
  finding: 30

# rule-check: sentences matching any of these (case-insensitive) may state a rule and are checked against the
# vault. Keep them specific: plain words like "must" would send every answer to the judge.
rule_hints:
  - '\b\d+\s*C\.?F\.?R\b|\bU\.?S\.?C\b|\bINA\b|\bUSCIS\b|Policy Manual|\bAAO\b|Kazarian|Chawathe'
  - 'preponderance|final[- ]merits|two[- ](?:step|part) (?:analysis|review)|standard of proof'
  - '\bForm\s+[A-Z]{1,2}-?\d|\bI-\d{3}[A-Z]?\b|\bG-1055\b|edition date'
  - '\bfiling fees?\b|\bfees?\b.{0,40}\$\s?\d|\$\s?\d[\d,]*(?:\.\d+)?\s*(?:fee|filing)|premium processing'
  - 'processing times?|business days|calendar days|within \d+ days'
  - 'visa bulletin|priority dates?|final action dates?|dates? for filing'
  - 'at least (?:three|3) of|(?:three|3) of the (?:ten|eight|10|8|following)|(?:ten|eight|10|8) criteria'
  - 'one[- ]time achievement|sustained national or international acclaim|small percentage .{0,30}top of the field'
  - '\bregulations? (?:requires?|says?|states?)|\bthe law (?:requires?|says?)|is required to (?:file|submit|show)'

# The agent's web-search fallback for rule questions: Tier 1 domains first, then Tier 2. Official pages it reads
# on these domains are kept in the vault as findings (observations, not reviewed sources).
tier1_domains: [uscis.gov, ecfr.gov, federalregister.gov, travel.state.gov, justice.gov, uscode.house.gov,
                dhs.gov, govinfo.gov]
tier2_domains: [uscourts.gov, supremecourt.gov, courtlistener.com]

# Change signals (ADR 0011): a source naming a signal stays fresh until a relevant rule takes effect (Federal Register
# final rules from USCIS / DHS matched by CFR part or terms, or an eCFR amendment of a listed section). Sources with
# no signal (processing times, the Visa Bulletin) keep their freshness window.
signals:
  o1:
    terms: ["O-1", "O-1A", "extraordinary ability", "nonimmigrant classification for aliens of extraordinary"]
    cfr_parts: [214]
    ecfr_sections: ["214.2"]
  eb1:
    terms: ["EB-1", "EB-1A", "extraordinary ability", "first preference", "outstanding professors"]
    cfr_parts: [204]
    ecfr_sections: ["204.5"]
  fees:
    terms: ["fee schedule", "filing fee", "premium processing", "fee rule"]
    cfr_parts: [103, 106]
    ecfr_sections: ["106.2", "106.4"]
  forms:
    terms: ["Form I-129", "Form I-140", "I-129", "I-140", "form edition"]
    cfr_parts: [106]
    ecfr_sections: ["106.2"]

sources:
  # --------------------------------------------------------------------------- Tier 1: regulations, statute
  - id: ecfr-8cfr-214-2-o
    title: "8 CFR 214.2(o): aliens of extraordinary ability or achievement (O-1)"
    url: "https://www.ecfr.gov/api/versioner/v1/full/{ecfr_date}/title-8.xml?part=214&section=214.2"
    ecfr_title: 8
    tier: 1
    kind: regulation
    topics: [o1a]
    # The section opens with a table of contents; the paragraph itself continues "—(1) Classifications".
    start: '^\(o\) Aliens of extraordinary ability or achievement—'
    end: '^\(p\) Artists, athletes, and entertainers—'
  - id: ecfr-8cfr-204-5-h
    title: "8 CFR 204.5(h): aliens with extraordinary ability (EB-1A)"
    url: "https://www.ecfr.gov/api/versioner/v1/full/{ecfr_date}/title-8.xml?part=204&section=204.5"
    ecfr_title: 8
    tier: 1
    kind: regulation
    topics: [eb1a]
    start: '^\(h\) Aliens with extraordinary ability\. \(1\)'
    end: '^\(i\) Outstanding professors and researchers\. \(1\)'
  - id: ina-101-a-15-o
    title: "INA 101(a)(15)(O) (8 U.S.C. 1101(a)(15)(O))"
    url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1101&num=0&edition=prelim"
    tier: 1
    kind: statute
    topics: [o1a]
    start: '\(O\) an alien who'
    end: '\(P\) an alien having a foreign residence'
  - id: ina-203-b-1-a
    title: "INA 203(b)(1)(A) (8 U.S.C. 1153(b)(1)(A))"
    url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title8-section1153&num=0&edition=prelim"
    tier: 1
    kind: statute
    topics: [eb1a]
    start: '\(A\) Aliens with extraordinary ability'
    end: '\(B\) Outstanding professors and researchers'

